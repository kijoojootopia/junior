{% extends 'base.html' %}
{% block title %}국가별 화장품 수출 지도{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/export_dashboard.css') }}">
<main class="export-dashboard">
  <a href="{{ url_for('index') }}">← 대시보드</a>
  <h1>국가별 화장품 수출 지도</h1>
  <p>국가를 선택하면 한국의 화장품 수출 통계를 표시합니다.</p>
  <div class="export-map" aria-label="국가 선택 지도">
    <img src="{{ url_for('static', filename='img/world.svg') }}" alt="세계 지도">
    <button class="map-pin" style="--x:22%;--y:31%" data-country="US">미국</button>
    <button class="map-pin" style="--x:51%;--y:26%" data-country="DE">독일</button>
    <button class="map-pin" style="--x:49%;--y:29%" data-country="FR">프랑스</button>
    <button class="map-pin" style="--x:70%;--y:23%" data-country="RU">러시아</button>
    <button class="map-pin" style="--x:69%;--y:31%" data-country="KZ">카자흐스탄</button>
  </div>
  <nav class="country-list" aria-label="국가 목록">
    {% for code, name in countries.items() %}<button data-country="{{ code }}">{{ name }}</button>{% endfor %}
  </nav>
  <section class="export-results" aria-live="polite">
    <h2 id="country-title">국가를 선택하세요</h2>
    <p id="trade-status">수출 통계 자료가 등록되면 이곳에 표시됩니다.</p>
    <div class="export-cards">
      <div><h3>최근 수출액 (USD)</h3><p id="latest-export">—</p></div>
      <div><h3>전년 대비 성장률</h3><p id="growth-rate">—</p></div>
    </div>
    <div id="export-series" aria-label="연도별 수출액 추이"></div>
  </section>
</main>
<script src="{{ url_for('static', filename='js/export_dashboard.js') }}" defer></script>
{% endblock %}
